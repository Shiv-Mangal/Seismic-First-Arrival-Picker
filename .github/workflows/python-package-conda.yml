name: Tests (conda + pyGIMLi)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    # Every file must compile on the Python versions people run Spyder / Anaconda with
    # (f-strings were stricter before Python 3.12).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']      # pyGIMLi needs 3.10 or newer
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Compile every .py file
      run: python -m compileall -q picker tests example_data

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}          # login shell: the conda environment is active in every step
    steps:
    - uses: actions/checkout@v4

    - name: System libraries for headless Qt
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

    - name: Conda environment from environment.yml (pyGIMLi, PyQt5, ObsPy, ...)
      uses: conda-incubator/setup-miniconda@v3
      with:
        environment-file: environment.yml
        activate-environment: pg
        miniforge-version: latest
        conda-remove-defaults: true

    - name: Versions
      run: |
        python --version
        python picker/run_picker.py --check

    - name: Lint (syntax errors and undefined names stop the build)
      run: |
        flake8 . --count --select=E9,F63,F7,F821 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics | tail -n 3

    - name: Tests (synthetic data, no screen)
      env:
        QT_QPA_PLATFORM: offscreen
        MPLBACKEND: Agg
      run: pytest -v
